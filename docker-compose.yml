services:
  postgres:
    image: postgres:16.9-alpine
    container_name: study_tools_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-study_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-study_tools}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    memswap_limit: 384m
    cpus: "0.40"
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-study_bot} -d ${POSTGRES_DB:-study_tools}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: study_tools_bot_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    mem_limit: 192m
    memswap_limit: 256m
    cpus: "0.25"
    pids_limit: 64

  admin:
    build: .
    container_name: study_tools_bot_admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    command: uvicorn admin.app:app --host 0.0.0.0 --port 8080
    mem_limit: 128m
    memswap_limit: 192m
    cpus: "0.20"
    pids_limit: 64
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
